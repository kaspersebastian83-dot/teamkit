name: Tests
on:
  schedule:
    - cron: '43 5 * * *'  # UTC
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    name: Regeln (Node, ohne Browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/regeln.cjs
      - run: node tests/fokus.cjs
      - name: BerichtKit daneben holen (SPEKTRON-LOOK byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/berichtkit.git ../berichtkit 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/berichtkit.git ../berichtkit
      - run: node tests/look.cjs
        env:
          TEAMKIT_LOOK_PFLICHT: '1'
