name: Tests
on:
  schedule:
    - cron: '43 5 * * *'  # UTC
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-tests:
    name: Regeln (Node, ohne Browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/regeln.cjs
